services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: f1_bugambra
      POSTGRES_USER: f1_bugambra
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - f1_bugambra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1_bugambra -d f1_bugambra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  f1_bugambra_postgres:
