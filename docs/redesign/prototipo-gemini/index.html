<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Bugambra · Liga F1 25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       SISTEMA DE TOKENS UNIFICADOS (MENSAJE 5)
       Máximo 7 colores de interfaz + colores de escudería.
       Tipografía única con 5 tamaños fijos, radios, bordes y espaciados únicos.
       ========================================================================== */
    :root {
      /* Tipografía única y 5 escalas fijas */
      --font-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --fs-xs: 0.75rem;    /* 12px - Etiquetas, cabeceras de tabla, metadatos */
      --fs-sm: 0.875rem;   /* 14px - Texto secundario, controles, tablas */
      --fs-md: 1rem;       /* 16px - Cuerpo base y datos principales */
      --fs-lg: 1.25rem;    /* 20px - Títulos de bloque y nombres en tarjeta */
      --fs-xl: clamp(1.55rem, 3vw, 2.15rem); /* Títulos de página y clasificación */

      /* Espaciados fijos */
      --sp-1: 0.25rem;
      --sp-2: 0.5rem;
      --sp-3: 0.75rem;
      --sp-4: 1rem;
      --sp-5: 1.5rem;
      --sp-6: 2rem;

      /* Radios, grosor de línea y sombra sobria sin color */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 999px;
      --line-thin: 1px;
      --line-thick: 2px;
      --layout-max: 1180px;

      /* Colores de las 3 escuderías (solo para tarjetas, avatares y logos; nunca texto) */
      --team-zenith: #0369a1;
      --team-zenith-dark: #082f49;
      --team-alfa: #991b1b;
      --team-alfa-dark: #450a0a;
      --team-roses: #9d174d;
      --team-roses-dark: #500724;
    }

    :root[data-theme="dark"] {
      --bg-base: #0d0f14;        /* 1. Fondo liso general */
      --bg-surface: #151921;     /* 2. Paneles y tablas limpias */
      --bg-elevated: #1d222d;    /* Superficie secundaria */
      --text-main: #f3f5f8;      /* 3. Texto principal (> 14:1) */
      --text-muted: #9aa3b5;     /* 4. Texto secundario (>= 5.2:1) */
      --accent-f1: #e10600;      /* 5. Rojo F1 acento */
      --accent-amber: #f59e0b;   /* 6. Ámbar OVR / Aviso */
      --accent-ok: #10b981;      /* 7. Verde conciliado / positivo */
      --border-color: #283040;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    :root[data-theme="light"] {
      --bg-base: #f3f5f9;        /* 1. Fondo liso general */
      --bg-surface: #ffffff;     /* 2. Paneles y tablas limpias */
      --bg-elevated: #eaeef5;    /* Superficie secundaria */
      --text-main: #11151c;      /* 3. Texto principal (> 15:1) */
      --text-muted: #4a5365;     /* 4. Texto secundario (>= 6:1) */
      --accent-f1: #c40500;      /* 5. Rojo F1 accesible en claro */
      --accent-amber: #b45309;   /* 6. Ámbar accesible en claro */
      --accent-ok: #047857;      /* 7. Verde accesible en claro */
      --border-color: #d5dce6;
      --shadow-card: 0 2px 6px rgba(17, 21, 28, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-base);
      font-size: var(--fs-md);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 4.5rem;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: var(--fs-sm);
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Accesibilidad por teclado y tamaño mínimo de 44px */
    .btn, .tab-btn, .subnav-tab, .pill-filter, .icon-btn, .zara-link, .mob-nav-item {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      cursor: pointer;
      user-select: none;
    }

    :focus-visible {
      outline: var(--line-thick) solid var(--accent-amber);
      outline-offset: 2px;
    }

    /* ==========================================================================
       COMPONENTES UNIFICADOS DE INTERFAZ
       ========================================================================== */
    /* Botón principal y secundario únicos */
    .btn {
      padding: 0 var(--sp-4);
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: var(--fs-sm);
      border: var(--line-thin) solid transparent;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent-f1);
      color: #ffffff;
      border-color: var(--accent-f1);
    }

    .btn-secondary {
      background-color: var(--bg-elevated);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    /* Campo de formulario único */
    .form-field {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }

    .form-field label {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .form-input {
      min-height: 44px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius-sm);
      border: var(--line-thin) solid var(--border-color);
      background-color: var(--bg-base);
      color: var(--text-main);
      font-size: var(--fs-sm);
    }

    /* Tarjeta base única (fondo liso, sin neones ni cristal) */
    .card, .section-card {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--sp-5);
      margin-bottom: var(--sp-5);
      box-shadow: var(--shadow-card);
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
      padding-bottom: var(--sp-3);
      border-bottom: var(--line-thin) solid var(--border-color);
    }

    .section-title {
      font-size: var(--fs-lg);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .page-title {
      font-size: var(--fs-xl);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    /* Etiquetas e insignias limpias */
    .badge-pill, .status-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-pill);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background-color: var(--bg-elevated);
      border: var(--line-thin) solid var(--border-color);
      color: var(--text-main);
    }

    .badge-season {
      border-color: var(--accent-ok);
    }

    .badge-split {
      border-color: var(--accent-f1);
    }

    .ovr-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-sm);
      font-size: var(--fs-xs);
      font-weight: 800;
      border: var(--line-thin) solid var(--accent-amber);
      color: var(--accent-amber);
      background-color: transparent;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       BARRA DE PROTOTIPO, CABECERA Y MENÚ LATERAL TIPO ZARA
       ========================================================================== */
    .proto-bar {
      background-color: #07080b;
      color: #f3f5f8;
      border-bottom: var(--line-thick) solid var(--accent-f1);
      padding: var(--sp-2) var(--sp-4);
      font-size: var(--fs-xs);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-2);
      position: sticky;
      top: 0;
      z-index: 1200;
    }

    .proto-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sp-2);
    }

    .proto-tag {
      background-color: var(--accent-f1);
      color: #ffffff;
      font-weight: 800;
      text-transform: uppercase;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
    }

    .proto-select, .proto-btn {
      background-color: #151921;
      color: #f3f5f8;
      border: var(--line-thin) solid #283040;
      border-radius: var(--radius-sm);
      padding: 0 var(--sp-2);
      min-height: 36px;
      font-size: var(--fs-xs);
      cursor: pointer;
    }

    .site-header {
      background-color: var(--bg-surface);
      border-bottom: var(--line-thin) solid var(--border-color);
      position: sticky;
      top: 46px;
      z-index: 900;
    }

    .header-inner {
      max-width: var(--layout-max);
      margin: 0 auto;
      padding: var(--sp-2) var(--sp-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
    }

    .brand-left, .header-actions {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }

    .icon-btn {
      background-color: var(--bg-elevated);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0 var(--sp-3);
      font-weight: 700;
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: var(--fs-md);
    }

    .brand-mark {
      background-color: var(--accent-f1);
      color: #ffffff;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-weight: 900;
    }

    .live-pill {
      padding: 0 var(--sp-3);
      min-height: 44px;
      border-radius: var(--radius-pill);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      border: var(--line-thin) solid var(--border-color);
      background-color: var(--bg-elevated);
      color: var(--text-muted);
    }

    .live-pill.is-live {
      background-color: var(--accent-f1);
      color: #ffffff;
      border-color: var(--accent-f1);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* Menú lateral izquierdo tipo Zara (enlaces grandes y finos) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.65);
      z-index: 1300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .drawer-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .zara-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(400px, 88vw);
      background-color: var(--bg-base);
      border-right: var(--line-thin) solid var(--border-color);
      z-index: 1350;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--sp-5);
      overflow-y: auto;
    }

    .zara-drawer.is-open {
      transform: translateX(0);
    }

    .zara-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: var(--sp-4);
      border-bottom: var(--line-thin) solid var(--border-color);
    }

    .zara-section-label {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin: var(--sp-4) 0 var(--sp-2);
      font-weight: 700;
    }

    .zara-nav {
      display: flex;
      flex-direction: column;
    }

    .zara-link {
      justify-content: space-between;
      width: 100%;
      padding: var(--sp-2) 0;
      font-size: 1.35rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-main);
      border-bottom: var(--line-thin) solid transparent;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .zara-link:hover, .zara-link.is-active {
      border-bottom-color: var(--accent-f1);
      transform: translateX(4px);
    }

    .zara-link small {
      font-size: var(--fs-xs);
      letter-spacing: 0.04em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .zara-footer {
      margin-top: var(--sp-5);
      padding-top: var(--sp-3);
      border-top: var(--line-thin) solid var(--border-color);
      font-size: var(--fs-xs);
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
    }

    /* Contenedor de página único con transición corta en cambio de vista */
    .main-container {
      max-width: var(--layout-max);
      margin: 0 auto;
      padding: var(--sp-5) var(--sp-4) var(--sp-6);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .main-container.view-enter {
      animation: viewFade 0.18s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       PESTAÑAS Y SUBNAVEGACIÓN DE TEMPORADA (UNIFICADAS)
       ========================================================================== */
    .scroll-tabs-wrapper {
      margin-bottom: var(--sp-4);
    }

    .scroll-hint-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      margin-bottom: var(--sp-1);
    }

    .scroll-tabs {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      overflow-x: auto;
      padding-bottom: var(--sp-2);
      border-bottom: var(--line-thin) solid var(--border-color);
    }

    .tab-btn {
      background-color: transparent;
      border: none;
      border-bottom: var(--line-thick) solid transparent;
      color: var(--text-muted);
      padding: 0 var(--sp-3);
      font-weight: 700;
      font-size: var(--fs-sm);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      border-radius: 0;
    }

    .tab-btn[aria-selected="true"] {
      color: var(--text-main);
      border-bottom-color: var(--accent-f1);
    }

    /* Subnavegación estilo resultados oficiales (Selector de temporada + pestañas subrayadas en rojo) */
    .f1-subnav-bar {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
    }

    .f1-subnav-links {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      overflow-x: auto;
    }

    .subnav-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 0 var(--sp-2);
      font-size: var(--fs-sm);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .subnav-tab.is-active {
      color: var(--text-main);
      border-bottom-color: var(--accent-f1);
    }

    .pill-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }

    .pill-filter {
      padding: 0 var(--sp-4);
      border-radius: var(--radius-pill);
      border: var(--line-thin) solid var(--border-color);
      background-color: var(--bg-surface);
      color: var(--text-main);
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pill-filter[aria-pressed="true"] {
      background-color: var(--text-main);
      color: var(--bg-base);
      border-color: var(--text-main);
    }

    /* ==========================================================================
       PORTADA (COMPLETA EN CLASIFICACIÓN, COMPACTA EN EL RESTO)
       ========================================================================== */
    .hero-full {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-top: 3px solid var(--accent-f1);
      border-radius: var(--radius-md);
      padding: var(--sp-5);
      margin-bottom: var(--sp-5);
    }

    .hero-badges-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-3);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-5);
      align-items: center;
    }

    @media (min-width: 860px) {
      .hero-grid {
        grid-template-columns: 1.35fr 1fr;
      }
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: var(--fs-md);
      margin: var(--sp-2) 0 var(--sp-4);
      max-width: 60ch;
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }

    .next-gp-card {
      background-color: var(--bg-base);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-3);
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-2);
      text-align: center;
    }

    .cd-box {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: var(--sp-2) var(--sp-1);
    }

    .cd-num {
      font-size: var(--fs-lg);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      display: block;
    }

    .cd-label {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .hero-compact {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-left: 3px solid var(--accent-f1);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      margin-bottom: var(--sp-4);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
    }

    .hero-compact-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--sp-2);
    }

    .hero-compact-title h1 {
      font-size: var(--fs-lg);
      font-weight: 800;
      text-transform: uppercase;
    }

    /* ==========================================================================
       PARTE 1 MENSAJE 4: TARJETAS GRANDES DE PILOTO (Color escudería + degradado + trama)
       Único lugar junto a las tarjetas de escudería donde se usa degradado y trama.
       Texto blanco garantizado >= 7:1 sobre el fondo oscuro de cada escudería.
       ========================================================================== */
    .f1-drivers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-4);
    }

    @media (min-width: 780px) {
      .f1-drivers-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .team-surface-zenith {
      background-color: var(--team-zenith-dark);
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
        linear-gradient(135deg, var(--team-zenith-dark) 0%, var(--team-zenith) 100%);
      background-size: 12px 12px, 100% 100%;
      color: #ffffff;
    }

    .team-surface-alfa {
      background-color: var(--team-alfa-dark);
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
        linear-gradient(135deg, var(--team-alfa-dark) 0%, var(--team-alfa) 100%);
      background-size: 12px 12px, 100% 100%;
      color: #ffffff;
    }

    .team-surface-roses {
      background-color: var(--team-roses-dark);
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.13) 1px, transparent 1px),
        linear-gradient(135deg, var(--team-roses-dark) 0%, var(--team-roses) 100%);
      background-size: 12px 12px, 100% 100%;
      color: #ffffff;
    }

    .f1-driver-card {
      position: relative;
      border-radius: var(--radius-lg);
      border: var(--line-thin) solid rgba(255, 255, 255, 0.22);
      overflow: hidden;
      min-height: 230px;
      padding: var(--sp-4) var(--sp-5) 0 var(--sp-5);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.16s ease;
    }

    .f1-driver-card:hover {
      transform: translateY(-2px);
    }

    .f1-driver-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: var(--sp-4);
      z-index: 2;
      max-width: 62%;
    }

    .f1-driver-firstname {
      font-size: var(--fs-sm);
      font-weight: 400;
      opacity: 0.92;
      display: block;
      line-height: 1.2;
    }

    .f1-driver-alias {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: block;
      line-height: 1.1;
    }

    .f1-driver-teamname {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
      margin-top: 0.2rem;
      display: block;
    }

    /* En lugar de dorsal: OVR en cifra grande de contorno + Nivel */
    .f1-driver-ovr-block {
      display: flex;
      align-items: baseline;
      gap: var(--sp-2);
      margin: var(--sp-2) 0;
    }

    .f1-ovr-outline {
      font-size: 2.75rem;
      font-weight: 900;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.75px #ffffff;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .f1-tier-tag {
      font-size: var(--fs-xs);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-sm);
      background-color: rgba(0, 0, 0, 0.35);
      border: var(--line-thin) solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    .f1-team-logo-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.45);
      border: var(--line-thick) solid rgba(255, 255, 255, 0.75);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-xs);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #ffffff;
      flex-shrink: 0;
    }

    /* Silueta/Foto recortada a la derecha llegando hasta el borde inferior */
    .f1-driver-cutout {
      align-self: flex-end;
      width: 148px;
      height: 195px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      z-index: 1;
      flex-shrink: 0;
    }

    .f1-driver-cutout svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==========================================================================
       PARTE 2 MENSAJE 4: TARJETAS GRANDES DE ESCUDERÍA (#equipos)
       ========================================================================== */
    .f1-teams-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-5);
      margin-bottom: var(--sp-5);
    }

    @media (min-width: 900px) {
      .f1-teams-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .f1-team-card {
      border-radius: var(--radius-lg);
      border: var(--line-thin) solid rgba(255, 255, 255, 0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.16s ease;
    }

    .f1-team-card:hover {
      transform: translateY(-2px);
    }

    .f1-team-card-top {
      padding: var(--sp-4) var(--sp-5);
      display: flex;
       flex-direction: column;
      gap: var(--sp-3);
    }

    .f1-team-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-3);
    }

    .f1-team-title {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.1;
    }

    .f1-team-drivers-inline {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }

    .f1-inline-driver-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background-color: rgba(0, 0, 0, 0.35);
      border: var(--line-thin) solid rgba(255, 255, 255, 0.25);
      padding: 0.2rem 0.55rem 0.2rem 0.25rem;
      border-radius: var(--radius-pill);
      font-size: var(--fs-xs);
      color: #ffffff;
    }

    .f1-mini-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.65rem;
    }

    /* Mitad inferior: cartel de escudería a sangre + franja fina con puntos y media OVR */
    .f1-team-poster-bleed {
      position: relative;
      background-color: rgba(0, 0, 0, 0.28);
      border-top: var(--line-thin) solid rgba(255, 255, 255, 0.18);
      min-height: 135px;
      padding: var(--sp-4) var(--sp-5);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .f1-team-Bottom-strip {
      background-color: rgba(0, 0, 0, 0.55);
      padding: var(--sp-2) var(--sp-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--fs-xs);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: var(--line-thin) solid rgba(255, 255, 255, 0.2);
    }

    /* ==========================================================================
       PARTE 3 MENSAJE 4: TABLA LIMPIA DE CLASIFICACIÓN (Y TABLA ÚNICA EN TODA LA WEB)
       Filas separadas por líneas finas, sin colores de fondo.
       En móvil: POS, Piloto con su escudería debajo en pequeño, y PTS.
       ========================================================================== */
    .clean-table-panel {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      overflow-x: auto;
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--fs-sm);
    }

    .standings-table th {
      text-align: left;
      font-size: var(--fs-xs);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: var(--sp-3);
      border-bottom: var(--line-thick) solid var(--border-color);
    }

    .standings-table td {
      padding: var(--sp-3);
      border-bottom: var(--line-thin) solid var(--border-color);
      background: transparent;
      vertical-align: middle;
    }

    .standings-table tr:last-child td {
      border-bottom: none;
    }

    .standings-table th.col-right,
    .standings-table td.col-right {
      text-align: right;
    }

    /* Símbolo de podio idéntico para 1.º, 2.º y 3.º en la columna POS */
    .pos-cell {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .podium-marker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: var(--radius-sm);
      border: var(--line-thin) solid var(--accent-amber);
      color: var(--accent-amber);
      font-size: 0.7rem;
      font-weight: 900;
    }

    /* Avatar redondo con borde del color de su escudería */
    .driver-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--bg-elevated);
      border: var(--line-thick) solid var(--border-color);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: var(--fs-xs);
      color: var(--text-main);
      flex-shrink: 0;
    }

    .pilot-trigger {
      background: none;
      border: none;
      color: inherit;
      padding: 0;
      cursor: pointer;
      text-align: left;
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      min-height: 44px;
    }

    .pilot-trigger:hover .driver-name {
      text-decoration: underline;
    }

    .driver-name {
      font-weight: 800;
      font-size: var(--fs-md);
    }

    .mobile-sub-team {
      display: block;
      font-size: var(--fs-xs);
      color: var(--text-muted);
      font-weight: 600;
    }

    .team-cell-inline {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      font-weight: 700;
    }

    .team-logo-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 900;
      color: #ffffff;
      flex-shrink: 0;
    }

    .pts-strong {
      font-weight: 900;
      font-size: var(--fs-md);
      font-variant-numeric: tabular-nums;
    }

    .gap-pill {
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* En móvil: solo POS, PILOTO (con escudería debajo en pequeño) y PTS */
    @media (max-width: 720px) {
      .hide-on-mobile {
        display: none !important;
      }
    }

    @media (min-width: 721px) {
      .mobile-sub-team {
        display: none;
      }
    }

    /* ==========================================================================
       GRIDS COMUNES (KPIs, Paddock, Auth, Barra inferior móvil y Modales)
       ========================================================================== */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--sp-4);
      margin-bottom: var(--sp-5);
    }

    .kpi-card {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--sp-2);
    }

    .kpi-label {
      font-size: var(--fs-xs);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .kpi-value {
      font-size: var(--fs-lg);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .sub-grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-4);
    }

    @media (min-width: 820px) {
      .sub-grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    .paddock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--sp-4);
    }

    .poster-card {
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .poster-banner {
      padding: var(--sp-4);
      color: #ffffff;
    }

    .poster-body {
      padding: var(--sp-4);
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
    }

    .poster-meta {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      padding-top: var(--sp-2);
      border-top: var(--line-thin) solid var(--border-color);
    }

    .auth-split {
      display: grid;
      grid-template-columns: 1fr;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: var(--line-thin) solid var(--border-color);
      background-color: var(--bg-surface);
    }

    @media (min-width: 860px) {
      .auth-split {
        grid-template-columns: 1fr 1fr;
      }
    }

    .auth-visual {
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--sp-5);
    }

    .auth-form-pane {
      padding: var(--sp-6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--sp-4);
    }

    /* Chips de filtro en Mi Escudería */
    .source-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-bottom: var(--sp-4);
    }

    .chip-btn {
      background-color: var(--bg-elevated);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      padding: 0 var(--sp-3);
      font-size: var(--fs-xs);
      font-weight: 700;
      min-height: 44px;
      cursor: pointer;
    }

    .chip-btn[aria-pressed="true"] {
      background-color: var(--accent-f1);
      color: #ffffff;
      border-color: var(--accent-f1);
    }

    /* Barra inferior móvil (5 accesos) */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border-top: var(--line-thin) solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 1100;
      padding: var(--sp-1);
    }

    .mobile-bottom-nav[hidden] {
      display: none !important;
    }

    @media (min-width: 900px) {
      .mobile-bottom-nav {
        display: none !important;
      }
    }

    .mob-nav-item {
      font-size: var(--fs-xs);
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
    }

    .mob-nav-item.is-active {
      color: var(--text-main);
      border-bottom: 2px solid var(--accent-f1);
    }

    /* Ventana modal Carta del Piloto (con giro 3D limpio) y Confirmación */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .pilot-modal-dialog {
      width: min(560px, 96vw);
      max-height: 92vh;
      overflow-y: auto;
      background-color: var(--bg-surface);
      border: var(--line-thin) solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      box-shadow: var(--shadow-card);
    }

    .card-flip-scene {
      perspective: 1100px;
      width: 100%;
    }

    .card-flip-inner {
      position: relative;
      width: 100%;
      transition: transform 0.45s ease;
      transform-style: preserve-3d;
    }

    .card-flip-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-md);
      border: var(--line-thin) solid var(--border-color);
      overflow: hidden;
    }

    .card-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
      background-color: var(--bg-surface);
      padding: var(--sp-4);
      overflow-y: auto;
    }

    .toast-msg {
      position: fixed;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--bg-surface);
      color: var(--text-main);
      border: var(--line-thick) solid var(--accent-ok);
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--radius-md);
      font-size: var(--fs-sm);
      font-weight: 700;
      z-index: 1600;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }

    /* Respeto estricto a prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       CAPA DE PULIDO (22-10-2026)
       Un solo estilo para toda la web: tipografía Titillium, colores reales de
       las escuderías, menos cajas dentro de cajas y cabecera con iconos.
       ========================================================================== */
    :root {
      --font-base: "Titillium Web", "Segoe UI", system-ui, -apple-system, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --team-zenith: #b8902f;
      --team-zenith-dark: #0f0c06;
      --team-alfa: #2c5aa0;
      --team-alfa-dark: #08111f;
      --team-roses: #e0307a;
      --team-roses-dark: #14050c;
    }

    :root[data-theme="dark"] {
      --bg-base: #0b0c10;
      --bg-surface: #14161c;
      --bg-elevated: #1c1f27;
      --text-main: #f4f5f7;
      --text-muted: #a0a6b2;
      --border-color: #252933;
      --shadow-card: none;
    }

    :root[data-theme="light"] {
      --bg-base: #f4f2ee;
      --bg-surface: #ffffff;
      --bg-elevated: #ebe8e2;
      --text-main: #15151e;
      --text-muted: #55555f;
      --border-color: #e0ddd6;
      --shadow-card: none;
    }

    [hidden] { display: none !important; }

    body {
      font-family: var(--font-base);
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.005em;
    }

    /* ── Títulos: una sola escala ── */
    .page-title, .section-title, .hero-compact-title h1, .f1-team-title, .f1-driver-alias {
      font-family: var(--font-base);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .page-title { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1; }
    .section-title { font-size: 1.35rem; text-transform: uppercase; }
    .eyebrow {
      display: block;
      font-size: var(--fs-xs);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      width: 100%;
    }

    /* ── Secciones sin caja: solo título y contenido sobre el fondo ── */
    .section-card {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      margin-bottom: var(--sp-6);
      box-shadow: none;
    }
    .section-header {
      border-bottom: 0;
      padding-bottom: 0;
      margin-bottom: var(--sp-4);
    }

    /* Superficies: tablas, KPI y tarjetas sencillas, sin borde marcado */
    .card, .clean-table-panel, .kpi-card, .next-gp-card, .f1-subnav-bar {
      border: 0;
      border-radius: var(--radius-md);
      box-shadow: none;
    }
    .clean-table-panel { padding: var(--sp-2) var(--sp-5); }
    .clean-table-panel .clean-table-panel { padding: 0; background: transparent; }

    /* ── Botones: píldora, sin sombras ── */
    .btn {
      border-radius: var(--radius-pill);
      padding: 0 1.25rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .btn-sm { min-height: 40px; padding: 0 1.1rem; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-secondary {
      background: transparent;
      border-color: var(--border-color);
    }
    .btn-secondary:hover { border-color: var(--text-muted); }

    /* ── Cabecera ── */
    .site-header {
      background-color: var(--bg-base);
      border-bottom: 1px solid var(--border-color);
    }
    .header-inner { padding: 0.5rem var(--sp-4); min-height: 64px; }
    .menu-btn {
      width: 44px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 50%;
      color: var(--text-main);
    }
    .menu-btn:hover { background-color: var(--bg-elevated); }
    .burger { display: inline-flex; flex-direction: column; gap: 5px; width: 20px; }
    .burger span { display: block; height: 1.6px; background: currentColor; border-radius: 2px; }
    .burger span:nth-child(2) { width: 14px; }
    .theme-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.6px solid currentColor;
      background: linear-gradient(90deg, currentColor 50%, transparent 50%);
    }
    .brand-logo { font-size: 1.15rem; letter-spacing: 0.02em; gap: 0.6rem; }
    .brand-mark { font-style: italic; padding: 0.1rem 0.5rem; border-radius: 6px; }
    .live-pill:not(.is-live) { display: none; }
    .live-pill { min-height: 36px; border: 0; }
    .account-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      padding: 0 0.35rem 0 0.35rem;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: var(--fs-sm);
    }
    .account-btn:hover { background-color: var(--bg-elevated); }
    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--accent-f1);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-weight: 900;
    }
    .account-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top; }

    /* ── Menú lateral ── */
    .zara-drawer { padding: var(--sp-4) var(--sp-5) var(--sp-5); background-color: var(--bg-base); }
    .zara-header { border-bottom: 0; padding-bottom: var(--sp-3); }
    .zara-section-label { margin-top: var(--sp-5); letter-spacing: 0.16em; }
    .zara-link {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      text-transform: none;
      padding: 0.35rem 0;
      border-bottom: 0;
