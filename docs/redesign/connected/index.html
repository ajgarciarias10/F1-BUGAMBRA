<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 BUGAMBRA — Liga Privada de Fórmula 1</title>
  <style>
    /* ==========================================================================
       SISTEMA DE DISEÑO EDITORIAL — MÁXIMO 7 COLORES (TEMA 6 IPO)
       Prohibido: sombras, bordes redondeados, degradados, pares rojo-verde/azul-amarillo/rojo-azul.
       ========================================================================== */
    :root {
      --c-paper: #FFFFFF;      /* 1. Papel (Fondo principal) */
      --c-surface: #F4F4F2;    /* 2. Superficie (Fondos secundarios) */
      --c-ink: #0A0A0A;        /* 3. Tinta (Texto y líneas principales - Contraste 19.8:1) */
      --c-muted: #525252;      /* 4. Gris de apoyo (Texto secundario - Contraste 7.5:1) */
      --c-brand: #C8102E;      /* 5. Rojo de marca F1 (Acento puntual - Contraste 5.6:1) */
      --c-data-1: #0D5C63;     /* 6. Dato 1: Petróleo oscuro (Contraste 7.4:1) */
      --c-data-2: #7A4900;     /* 7. Dato 2: Ocre oscuro (Contraste 6.8:1) */
      --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --header-h: 56px;
      --bottom-bar-h: 56px;
    }

    html[data-theme="dark"] {
      --c-paper: #0A0A0A;      /* 1. Papel oscuro (Casi negro) */
      --c-surface: #161616;    /* 2. Superficie oscura */
      --c-ink: #F5F5F3;        /* 3. Tinta clara (Contraste 18.2:1) */
      --c-muted: #A3A3A3;      /* 4. Gris de apoyo claro (Contraste 7.8:1) */
      --c-brand: #FF4D6A;      /* 5. Rojo de marca adaptado a oscuro (Contraste 5.9:1) */
      --c-data-1: #4DD0E1;     /* 6. Dato 1 en oscuro (Contraste 10.4:1) */
      --c-data-2: #FFB74D;     /* 7. Dato 2 en oscuro (Contraste 10.8:1) */
    }

    /* Reset estricto: 0 border-radius, 0 box-shadow en toda la interfaz */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    html {
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      background-color: var(--c-paper);
      color: var(--c-ink);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--header-h);
      padding-bottom: calc(var(--bottom-bar-h) + 48px);
      overflow-x: hidden;
    }

    /* Control de movimiento (TC-16 y US-24) */
    @media (prefers-reduced-motion: no-preference) {
      html:not([data-motion="reduced"]) .screen-enter {
        animation: editorialFade 0.22s ease-out;
      }
    }
    @keyframes editorialFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Foco accesible y altamente visible (TC-14) */
    :focus-visible {
      outline: 2px solid var(--c-ink) !important;
      outline-offset: 2px !important;
    }

    /* Tipografía Editorial */
    h1, h2, h3, h4, .editorial-label, .nav-caps {
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .display-hero {
      font-size: clamp(2.2rem, 6vw, 4.8rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .page-title {
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      font-weight: 300;
      letter-spacing: 0.14em;
      line-height: 1.2;
      padding: 24px 16px 16px;
      border-bottom: 1px solid var(--c-ink);
    }

    .section-header {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-muted);
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-ink);
      background-color: var(--c-surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .small-caps-caption {
      font-variant: small-caps;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: var(--c-muted);
      padding: 8px 16px;
      border-bottom: 1px solid var(--c-ink);
    }

    /* Objetivos táctiles >= 44x44 px (TC-18) */
    button, a, select, input[type="checkbox"], input[type="radio"], .touch-target {
      min-height: 44px;
      min-width: 44px;
    }

    a {
      color: var(--c-ink);
      text-decoration: underline;
      text-underline-offset: 4px;
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      background: transparent;
      border: none;
    }

    a:hover, .btn-link:hover {
      color: var(--c-brand);
    }

    /* Botón de enlace pequeño subrayado */
    .btn-link {
      background: transparent;
      border: none;
      color: var(--c-ink);
      text-decoration: underline;
      text-underline-offset: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Acción principal: rectángulo negro de ancho completo con texto blanco en mayúsculas */
    .btn-primary {
      width: 100%;
      background-color: var(--c-ink);
      color: var(--c-paper);
      border: 1px solid var(--c-ink);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      padding: 14px 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      gap: 8px;
    }

    .btn-primary:hover {
      background-color: var(--c-paper);
      color: var(--c-ink);
    }

    .btn-secondary {
      width: 100%;
      background-color: var(--c-paper);
      color: var(--c-ink);
      border: 1px solid var(--c-ink);
      font-family: var(--font-sans);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      padding: 12px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      gap: 8px;
    }

    .btn-secondary:hover {
      background-color: var(--c-surface);
    }

    /* Cabecera fija */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background-color: var(--c-paper);
      border-bottom: 1px solid var(--c-ink);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 8px;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-brand {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      background-color: var(--c-brand);
      display: inline-block;
    }

    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    /* Menú lateral izquierdo (Nunca circular) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--c-paper);
      opacity: 0.85;
      z-index: 1100;
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(380px, 100vw);
      background-color: var(--c-paper);
      border-right: 1px solid var(--c-ink);
      z-index: 1200;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .side-drawer.open {
      display: flex;
    }

    .drawer-header {
      height: var(--header-h);
      border-bottom: 1px solid var(--c-ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .drawer-section-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--c-muted);
      padding: 16px 16px 6px;
      border-bottom: 1px solid var(--c-ink);
      background-color: var(--c-surface);
    }

    .drawer-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .drawer-link:hover, .drawer-link[aria-current="page"] {
      background-color: var(--c-surface);
    }

    .drawer-link[aria-current="page"]::before {
      content: "■ ";
      color: var(--c-brand);
      margin-right: 8px;
      font-size: 10px;
    }

    /* Rejillas editoriales sin huecos (líneas de 1 px) */
    .editorial-grid {
      display: grid;
      grid-template-columns: 1fr;
      border-bottom: 1px solid var(--c-ink);
    }

    .editorial-cell {
      padding: 16px;
      border-bottom: 1px solid var(--c-ink);
    }

    .editorial-cell:last-child {
      border-bottom: none;
    }

    @media (min-width: 768px) {
      .editorial-grid.cols-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      .editorial-grid.cols-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .editorial-grid.cols-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .editorial-grid.cols-2 > .editorial-cell,
      .editorial-grid.cols-3 > .editorial-cell,
      .editorial-grid.cols-4 > .editorial-cell {
        border-bottom: none;
        border-right: 1px solid var(--c-ink);
      }
      .editorial-grid.cols-2 > .editorial-cell:nth-child(2n),
      .editorial-grid.cols-3 > .editorial-cell:nth-child(3n),
      .editorial-grid.cols-4 > .editorial-cell:nth-child(4n) {
        border-right: none;
      }
    }

    /* Contenedor máximo 1440px */
    .layout-container {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      border-left: 1px solid var(--c-ink);
      border-right: 1px solid var(--c-ink);
      flex: 1;
    }

    @media (max-width: 1440px) {
      .layout-container {
        border-left: none;
        border-right: none;
      }
    }

    /* Campos de formulario solo con línea inferior y etiqueta pequeña en mayúsculas */
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-ink);
      margin-bottom: 4px;
      font-weight: 400;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--c-ink);
      color: var(--c-ink);
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 4px;
      min-height: 44px;
    }

    .form-select option {
      background-color: var(--c-paper);
      color: var(--c-ink);
    }

    .form-error {
      font-size: 12px;
      color: var(--c-brand);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-help {
      font-size: 11px;
      color: var(--c-muted);
      margin-top: 4px;
    }

    /* Tablas editoriales */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-bottom: 1px solid var(--c-ink);
    }

    table.editorial-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    table.editorial-table th,
    table.editorial-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-ink);
      font-size: 13px;
      vertical-align: middle;
    }

    table.editorial-table th {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--c-muted);
      background-color: var(--c-surface);
    }

    table.editorial-table tr:last-child td {
      border-bottom: none;
    }

    /* Muestras de equipo: solo cuadrado junto al nombre, nunca color de texto */
    .team-swatch {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1px solid var(--c-ink);
      margin-right: 8px;
      vertical-align: middle;
    }

    .swatch-p1 { background-color: var(--c-brand); }
    .swatch-p2 { background-color: var(--c-data-1); }
    .swatch-p3 { background-color: var(--c-data-2); }
    .swatch-p4 { background-color: var(--c-ink); }
    .swatch-p5 { background-color: var(--c-muted); }

    /* Etiquetas de estado con símbolo y texto (Nunca solo color - TC-08, TC-09, TC-17) */
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border: 1px solid var(--c-ink);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background-color: var(--c-paper);
    }

    .tx-income {
      color: var(--c-data-1);
      font-weight: 600;
    }

    .tx-expense {
      color: var(--c-data-2);
      font-weight: 600;
    }

    /* Imágenes a sangre */
    .bleed-figure {
      width: 100%;
      border-bottom: 1px solid var(--c-ink);
    }

    .bleed-figure svg {
      display: block;
      width: 100%;
      height: auto;
      background-color: var(--c-surface);
    }

    /* Barra de herramientas de simulación y revisión */
    .utility-strip {
      background-color: var(--c-surface);
      border-bottom: 1px solid var(--c-ink);
      padding: 6px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    .utility-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .util-btn {
      background: var(--c-paper);
      border: 1px solid var(--c-ink);
      color: var(--c-ink);
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 10px;
      cursor: pointer;
    }

    .util-btn[aria-pressed="true"] {
      background: var(--c-ink);
      color: var(--c-paper);
    }

    /* Barra inferior fija en móvil con la acción principal (US-23) */
    .mobile-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--c-paper);
      border-top: 1px solid var(--c-ink);
      z-index: 950;
      display: flex;
      align-items: center;
    }

    @media (min-width: 960px) {
      .mobile-bottom-bar {
        display: none;
      }
      body {
        padding-bottom: 32px;
      }
    }

    /* Buscador global en cabecera (US-21) */
    .search-drawer {
      background-color: var(--c-paper);
      border-bottom: 1px solid var(--c-ink);
      padding: 16px;
      display: none;
    }
    .search-drawer.open {
      display: block;
    }

    /* Modo Revisión (RF-12 / US-20 / TC-19) */
    body.review-mode-active [data-reviewable] {
      outline: 1px dashed var(--c-brand);
      cursor: crosshair !important;
      position: relative;
    }

    .review-badge {
      display: inline-block;
      background-color: var(--c-brand);
      color: var(--c-paper);
      font-size: 10px;
      padding: 2px 6px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 6px;
      vertical-align: middle;
    }

    .editorial-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--c-paper);
      opacity: 0.92;
      z-index: 1500;
      display: none;
    }

    .editorial-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(520px, 94vw);
      background-color: var(--c-paper);
      border: 1px solid var(--c-ink);
      z-index: 1600;
      display: none;
      max-height: 90vh;
      overflow-y: auto;
    }

    .editorial-modal.open,
    .editorial-modal-backdrop.open {
      display: block;
    }

    /* Banner de notificación / Deshacer */
    .toast-banner {
      background-color: var(--c-ink);
      color: var(--c-paper);
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-paper);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .toast-banner.visible {
      display: flex;
    }

    .toast-banner button {
      background: var(--c-paper);
      color: var(--c-ink);
      border: 1px solid var(--c-paper);
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      cursor: pointer;
    }

    .metric-big {
      font-size: clamp(1.6rem, 3.5vw, 2.5rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <!-- CABECERA FIJA -->
  <header class="site-header" role="banner">
    <div class="header-left">
      <button type="button" id="menuToggleBtn" class="btn-link" aria-expanded="false" aria-controls="sideDrawer" aria-label="Abrir menú de navegación (Atajo tecla M)">
        ≡ MENÚ
      </button>
    </div>

    <a href="#portada" class="header-brand" aria-label="F1 Bugambra Portada">
      <span class="brand-dot" aria-hidden="true"></span>
      <span>F1 BUGAMBRA</span>
    </a>

    <div class="header-right">
      <button type="button" id="searchToggleBtn" class="btn-link" aria-expanded="false" aria-controls="searchPanel">
        BUSCAR
      </button>
      <a href="#login" id="headerAuthLink" class="btn-link">ENTRAR</a>
      <a href="#perfil" id="headerProfileLink" class="btn-link">PERFIL</a>
    </div>
  </header>

  <!-- PANEL DE BÚSQUEDA EN CABECERA (US-21) -->
  <section id="searchPanel" class="search-drawer" aria-label="Búsqueda global">
    <div style="max-width: 720px; margin: 0 auto;">
      <div class="form-group" style="margin-bottom: 8px;">
        <label for="globalSearchInput" class="form-label">BUSCAR PILOTO, ESCUDERÍA, CARRERA O PANTALLA</label>
        <input type="search" id="globalSearchInput" class="form-input" placeholder="Ej. Sainz, Bahrein, Al-Mansoor, Mercado...">
      </div>
      <div id="globalSearchResults" aria-live="polite"></div>
    </div>
  </section>

  <!-- BANNER DE ESTADO Y DESHACER (TC-13 / Principio 3 Nielsen) -->
  <div id="globalToast" class="toast-banner" role="status" aria-live="polite">
    <span id="globalToastText">Operación registrada.</span>
    <div style="display:flex; gap:8px;">
      <button type="button" id="globalUndoBtn" style="display:none;">DESHACER</button>
      <button type="button" id="globalToastCloseBtn" aria-label="Cerrar aviso">CERRAR ✕</button>
    </div>
  </div>

  <!-- BARRA DE CONTROL DE PROTOTIPO, ROLES, ESTADOS (TC-07, TC-10, TC-11) Y REVISIÓN (RF-12 / TC-19) -->
  <aside class="utility-strip" aria-label="Herramientas de verificación y revisión del prototipo">
    <div class="utility-group">
      <span style="text-transform:uppercase; letter-spacing:0.12em; color:var(--c-muted);">ROL ACTIVO:</span>
      <button type="button" class="util-btn" data-set-role="invitado" id="roleBtnInvitado" aria-pressed="false">INVITADO</button>
      <button type="button" class="util-btn" data-set-role="jeque" id="roleBtnJeque" aria-pressed="true">JEQUE</button>
      <button type="button" class="util-btn" data-set-role="admin" id="roleBtnAdmin" aria-pressed="false">ADMIN</button>
    </div>

    <div class="utility-group">
      <span style="text-transform:uppercase; letter-spacing:0.12em; color:var(--c-muted);">ESTADO DATOS (TC-07):</span>
      <button type="button" class="util-btn" data-set-viewstate="normal" id="stateBtnNormal" aria-pressed="true">NORMAL</button>
      <button type="button" class="util-btn" data-set-viewstate="loading" id="stateBtnLoading" aria-pressed="false">CARGA</button>
      <button type="button" class="util-btn" data-set-viewstate="empty" id="stateBtnEmpty" aria-pressed="false">SIN DATOS</button>
      <button type="button" class="util-btn" data-set-viewstate="error" id="stateBtnError" aria-pressed="false">ERROR</button>
    </div>

    <div class="utility-group">
      <button type="button" class="util-btn" id="themeToggleBtn" aria-pressed="false">TEMA: CLARO</button>
      <button type="button" class="util-btn" id="reviewModeToggleBtn" aria-pressed="false">REVISAR (0)</button>
      <button type="button" class="util-btn" id="downloadReviewJsonBtn">DESCARGAR JSON</button>
    </div>
  </aside>

  <!-- MENÚ LATERAL IZQUIERDO (22 RUTAS - TC-04, TC-05) -->
  <div id="drawerBackdrop" class="drawer-backdrop" tabindex="-1"></div>
  <nav id="sideDrawer" class="side-drawer" aria-label="Navegación principal de las 22 pantallas">

    /* Formato español estricto: 1.234,56 € (RF-06 / GUIDELINES.md #4) */
    function formatEuros(amount) {
      const absVal = Math.abs(Number(amount) || 0);
      const fixed = absVal.toFixed(2);
      const parts = fixed.split('.');
      const intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return `${intPart},${parts[1]} €`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getTeamById(id) {
      return state.equipos.find(t => t.id === id) || null;

    }

    function showToast(message, withUndo = false) {
      const banner = document.getElementById('globalToast');
      const textEl = document.getElementById('globalToastText');
      const undoBtn = document.getElementById('globalUndoBtn');
      textEl.textContent = message;
      undoBtn.style.display = withUndo && state.lastUndoSnapshot ? 'inline-flex' : 'none';
      banner.classList.add('visible');
    }

    function saveUndoSnapshot(label) {
      state.lastUndoSnapshot = {
        label,
        equipos: JSON.parse(JSON.stringify(state.equipos)),
        movimientos: JSON.parse(JSON.stringify(state.movimientos)),
        carreras: JSON.parse(JSON.stringify(state.carreras)),
        avisosBuzon: JSON.parse(JSON.stringify(state.avisosBuzon)),
        votacionActiva: JSON.parse(JSON.stringify(state.votacionActiva)),
        medios: JSON.parse(JSON.stringify(state.medios)),
        usuariosLiga: JSON.parse(JSON.stringify(state.usuariosLiga))
      };
    }

    function executeUndo() {
      if (!state.lastUndoSnapshot) return;
      const snap = state.lastUndoSnapshot;
      state.equipos = snap.equipos;
      state.movimientos = snap.movimientos;
      state.carreras = snap.carreras;
      state.avisosBuzon = snap.avisosBuzon;
      state.votacionActiva = snap.votacionActiva;
      state.medios = snap.medios;
      state.usuariosLiga = snap.usuariosLiga;
      state.lastUndoSnapshot = null;
      showToast(`Acción deshecha: ${snap.label}`, false);
      renderCurrentRoute(false);
    }

    /* Generador de etiqueta de resultado de piloto con texto y símbolo propios (RF-05 y TC-08) */
    function renderPilotRaceStatus(res) {
      if (res.estado === 'POSICION') {
        const podiumSymbol = res.posicion === 1 ? '★ ' : (res.posicion <= 3 ? '◆ ' : '');
        return `<span class="status-tag">${podiumSymbol}P${res.posicion} · Posición oficial (${res.puntos} pts)</span>`;
      }
      if (res.estado === 'DNF') {
        return `<span class="status-tag">✕ DNF (No clasificado · Retirado)</span>`;
      }
      if (res.estado === 'NO_PRESENTADO') {
        return `<span class="status-tag">○ No presentado (Ausente en parrilla)</span>`;
      }
      return `<span class="status-tag">? Posición desconocida (Sin acta de telemetría)</span>`;
    }

    function getNormalizedHash() {
      const raw = window.location.hash || '#portada';
      const exists = ROUTES_CONFIG.some(r => r.hash === raw);
      return exists ? raw : '#portada';
    }

    function buildDrawerNavigation(activeHash) {
      const container = document.getElementById('drawerLinksContainer');
      const groups = ['Públicas', 'Jeque', 'Administración'];
      let html = '';

      groups.forEach(groupName => {
        if (groupName === 'Administración' && state.role !== 'admin') {
          html += `
            <div class="drawer-section-label">ADMINISTRACIÓN (SOLO ROL ADMIN · TC-10/11)</div>
            <div style="padding:12px 16px; border-bottom:1px solid var(--c-ink); font-size:11px; color:var(--c-muted);">
              Entra como Administrador en la barra superior para habilitar las 5 pantallas <code>#admin-*</code>, o ábrelas para verificar todas las rutas:
            </div>
          `;
        } else {
          html += `<div class="drawer-section-label">${escapeHtml(groupName)}</div>`;
        }

        const routesInGroup = ROUTES_CONFIG.filter(r => r.group === groupName);
        routesInGroup.forEach(r => {
          const isCurrent = r.hash === activeHash;
          html += `
            <a href="${r.hash}" class="drawer-link" ${isCurrent ? 'aria-current="page"' : ''}>
              <span>${escapeHtml(r.title)}</span>
              <span style="font-size:11px; color:var(--c-muted);">${r.hash}</span>
            </a>
          `;
        });
      });

      container.innerHTML = html;
    }

    function syncHeaderAndToolbarUI(activeHash) {
      document.getElementById('roleBtnInvitado').setAttribute('aria-pressed', String(state.role === 'invitado'));
      document.getElementById('roleBtnJeque').setAttribute('aria-pressed', String(state.role === 'jeque'));
      document.getElementById('roleBtnAdmin').setAttribute('aria-pressed', String(state.role === 'admin'));

      document.getElementById('stateBtnNormal').setAttribute('aria-pressed', String(state.viewState === 'normal'));
      document.getElementById('stateBtnLoading').setAttribute('aria-pressed', String(state.viewState === 'loading'));
      document.getElementById('stateBtnEmpty').setAttribute('aria-pressed', String(state.viewState === 'empty'));
      document.getElementById('stateBtnError').setAttribute('aria-pressed', String(state.viewState === 'error'));

      const themeBtn = document.getElementById('themeToggleBtn');
      themeBtn.textContent = `TEMA: ${state.theme === 'light' ? 'CLARO' : 'OSCURO'}`;
      themeBtn.setAttribute('aria-pressed', String(state.theme === 'dark'));

      const revBtn = document.getElementById('reviewModeToggleBtn');
      revBtn.textContent = `REVISAR (${state.reviewMarks.length})`;
      revBtn.setAttribute('aria-pressed', String(state.reviewMode));
      document.body.classList.toggle('review-mode-active', state.reviewMode);

      // Actualizar barra inferior fija en móvil (US-23)
      const routeMeta = ROUTES_CONFIG.find(r => r.hash === activeHash) || ROUTES_CONFIG[0];
      const mobileBtn = document.getElementById('mobilePrimaryActionBtn');
      if (mobileBtn) {
        mobileBtn.textContent = routeMeta.primaryLabel;
        mobileBtn.setAttribute('href', routeMeta.primaryHref);
      }
    }

    function renderReviewBadgesOnDOM(activeHash) {
      const marksForRoute = state.reviewMarks.filter(m => m.route === activeHash);
      marksForRoute.forEach((mark, idx) => {
        try {
          const el = document.querySelector(mark.selector);
          if (el && !el.querySelector('.review-badge')) {
            const badge = document.createElement('span');
            badge.className = 'review-badge';
            badge.textContent = `NOTA #${idx + 1}: ${mark.note}`;
            el.appendChild(badge);
          }
        } catch (err) {
          // Selector seguro
        }
      });
    }

    function renderCurrentRoute(moveFocusToHeading = true) {
      const hash = getNormalizedHash();
      const mainEl = document.getElementById('appMain');

      const renderers = {
        '#portada': renderPortada,
        '#login': renderLogin,
        '#registro': renderRegistro,
        '#instalar': renderInstalar,
        '#sistema': renderSistema,
        '#inicio': renderInicio,
        '#escuderia': renderEscuderia,
        '#equipos': renderEquipos,
        '#campeonato': renderCampeonato,
        '#carreras': renderCarreras,
        '#mercado': renderMercado,
        '#comunidad': renderComunidad,
        '#comunidad-votacion': renderComunidadVotacion,
        '#comunidad-archivo': renderComunidadArchivo,
        '#telemetria': renderTelemetria,
        '#buzon': renderBuzon,
        '#perfil': renderPerfil,
        '#admin-inicio': renderAdminInicio,
        '#admin-carrera': renderAdminCarrera,
        '#admin-economia': renderAdminEconomia,
        '#admin-media': renderAdminMedia,
        '#admin-usuarios': renderAdminUsuarios
      };

      const viewFn = renderers[hash] || renderPortada;
      mainEl.innerHTML = viewFn();

      buildDrawerNavigation(hash);
      syncHeaderAndToolbarUI(hash);
      renderReviewBadgesOnDOM(hash);
      bindDynamicScreenEvents();

      // Al cambiar de pantalla, el foco va al título (GUIDELINES.md #4)
      if (moveFocusToHeading) {
        const heading = document.getElementById('screenTitleHeading');
        if (heading) {
          heading.focus();
        }
      }
    }

    function openDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const backdrop = document.getElementById('drawerBackdrop');
      const toggleBtn = document.getElementById('menuToggleBtn');
      drawer.classList.add('open');
      backdrop.classList.add('open');
      toggleBtn.setAttribute('aria-expanded', 'true');
      const closeBtn = document.getElementById('menuCloseBtn');
      if (closeBtn) closeBtn.focus();
    }

    function closeDrawer(returnFocus = true) {
      const drawer = document.getElementById('sideDrawer');
      const backdrop = document.getElementById('drawerBackdrop');
      const toggleBtn = document.getElementById('menuToggleBtn');
      if (!drawer.classList.contains('open')) return;
      drawer.classList.remove('open');
      backdrop.classList.remove('open');
      toggleBtn.setAttribute('aria-expanded', 'false');
      if (returnFocus && toggleBtn) {
        toggleBtn.focus();
      }
    }

    function simulateGoogleAuth() {
      state.role = 'jeque';
      state.currentUser.nombre = 'Jeque Ramiro Al-Mansoor (Google)';
      showToast('Autenticación con Google verificada correctamente. Bienvenido al despacho.', false);
      window.location.hash = '#inicio';
    }

    function bindDynamicScreenEvents() {
      // Login con validación sin culpar al usuario y manteniendo el foco (RF-01 / TC-02)
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const emailInput = document.getElementById('loginEmail');
          const passInput = document.getElementById('loginPassword');
          const emailErr = document.getElementById('loginEmailError');
          const passErr = document.getElementById('loginPasswordError');

          emailErr.style.display = 'none';
          passErr.style.display = 'none';

          const emailVal = emailInput.value.trim();
          const passVal = passInput.value;
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          if (!emailRegex.test(emailVal)) {
            emailErr.textContent = 'El formato del correo necesita incluir un signo @ y un dominio (por ejemplo: ramiro@bugambra.f1).';
            emailErr.style.display = 'flex';
            emailInput.focus();
            return;
          }

          if (passVal.length < 4) {
            passErr.textContent = 'La contraseña necesita al menos 4 caracteres para verificar la cuenta.';
            passErr.style.display = 'flex';
            passInput.focus();
            return;
          }

          state.role = emailVal.toLowerCase().includes('admin') ? 'admin' : 'jeque';
          state.currentUser.correo = emailVal;
          showToast(`Sesión iniciada como ${state.role.toUpperCase()} (${emailVal}).`, false);
          window.location.hash = '#inicio';
        });
      }

      const googleLoginBtn = document.getElementById('googleLoginBtn');
      if (googleLoginBtn) {
        googleLoginBtn.addEventListener('click', simulateGoogleAuth);
      }

      const googleRegisterBtn = document.getElementById('googleRegisterBtn');
      if (googleRegisterBtn) {
        googleRegisterBtn.addEventListener('click', simulateGoogleAuth);
      }

      // Registro (RF-01)
      const registerForm = document.getElementById('registerForm');
      if (registerForm) {
        registerForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const nameIn = document.getElementById('regName');
          const teamIn = document.getElementById('regTeam');
          const emailIn = document.getElementById('regEmail');
          const passIn = document.getElementById('regPass');

          const nameErr = document.getElementById('regNameError');
          const teamErr = document.getElementById('regTeamError');
          const emailErr = document.getElementById('regEmailError');
          const passErr = document.getElementById('regPassError');

          [nameErr, teamErr, emailErr, passErr].forEach(el => el.style.display = 'none');

          if (!nameIn.value.trim()) {
            nameErr.textContent = 'Indica el nombre con el que figurarás en el consejo de jeques.';
            nameErr.style.display = 'flex';
            nameIn.focus();
            return;
          }
          if (!teamIn.value.trim()) {
            teamErr.textContent = 'Indica el nombre de tu escudería para inscribirla en el campeonato.';
            teamErr.style.display = 'flex';
            teamIn.focus();
            return;
          }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailIn.value.trim())) {
            emailErr.textContent = 'Introduce una dirección de correo con formato nombre@dominio.com.';
            emailErr.style.display = 'flex';
            emailIn.focus();
            return;
          }
          if (passIn.value.length < 6) {
            passErr.textContent = 'Escribe una contraseña de al menos 6 caracteres.';
            passErr.style.display = 'flex';
            passIn.focus();
            return;
          }

          state.role = 'jeque';
          state.currentUser.nombre = nameIn.value.trim();
          state.currentUser.correo = emailIn.value.trim();
          showToast(`Cuenta de jeque registrada para ${state.currentUser.nombre}.`, false);
          window.location.hash = '#inicio';
        });
      }

      // Cambio de equipo en #escuderia
      const teamSwitchSelect = document.getElementById('teamSwitchSelect');
      if (teamSwitchSelect) {
        teamSwitchSelect.addEventListener('change', (e) => {
          state.selectedTeamId = e.target.value;
          renderCurrentRoute(false);
        });
      }

      // Inspeccionar equipo desde #equipos
      document.querySelectorAll('[data-inspect-team]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedTeamId = btn.getAttribute('data-inspect-team');
          window.location.hash = '#escuderia';
        });
      });

      // Seleccionar carrera en #carreras
      document.querySelectorAll('[data-select-race]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedRaceId = btn.getAttribute('data-select-race');
          renderCurrentRoute(false);
        });
      });

      // Publicar nuevo hilo en #comunidad
      const newThreadForm = document.getElementById('newThreadForm');
      if (newThreadForm) {
        newThreadForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const titleIn = document.getElementById('threadTitleInput');
          const bodyIn = document.getElementById('threadBodyInput');
          const errEl = document.getElementById('threadTitleError');
          if (!titleIn.value.trim() || !bodyIn.value.trim()) {
            errEl.textContent = 'Completa el título y el mensaje antes de publicar en el foro.';
            errEl.style.display = 'flex';
            titleIn.focus();
            return;
          }
          state.comunidadHilos.unshift({
            id: 'hilo-' + Date.now(),
            autor: state.currentUser.nombre,
            fecha: 'Hoy · Justo ahora',
            titulo: titleIn.value.trim(),
            respuestas: 0,
            resumen: bodyIn.value.trim()
          });
          showToast('Hilo publicado en el foro de la comunidad.', false);
          renderCurrentRoute(false);
        });
      }

      // Votar en #comunidad-votacion
      const pollVoteForm = document.getElementById('pollVoteForm');
      if (pollVoteForm) {
        pollVoteForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const checked = pollVoteForm.querySelector('input[name="pollOption"]:checked');
          const errEl = document.getElementById('pollVoteError');
          if (!checked) {
            errEl.textContent = 'Selecciona una de las opciones antes de registrar tu voto.';
            errEl.style.display = 'flex';
            return;
          }
          saveUndoSnapshot('Voto en consulta FIA');
          const opt = state.votacionActiva.opciones.find(o => o.id === checked.value);
          if (opt) {
            opt.votos += 1;
            state.votacionActiva.yaVoto = true;
            state.votacionActiva.opcionElegida = opt.id;
          }
          showToast('Voto registrado en el escrutinio oficial.', true);
          renderCurrentRoute(false);
        });
      }

      // Buzón leído / no leído (#buzon)
      document.querySelectorAll('[data-toggle-notice]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle-notice');
          const target = state.avisosBuzon.find(a => a.id === id);
          if (target) {
            target.leido = !target.leido;
            renderCurrentRoute(false);
          }
        });
      });

      const markAllReadBtn = document.getElementById('markAllReadBtn');
      if (markAllReadBtn) {
        markAllReadBtn.addEventListener('click', () => {
          state.avisosBuzon.forEach(a => a.leido = true);
          showToast('Todos los comunicados del buzón marcados como leídos.', false);
          renderCurrentRoute(false);
        });
      }

      // Perfil (#perfil)
      const profileThemeBtn = document.getElementById('profileThemeBtn');
      if (profileThemeBtn) {
        profileThemeBtn.addEventListener('click', toggleTheme);
      }

      const profileMotionBtn = document.getElementById('profileMotionBtn');
      if (profileMotionBtn) {
        profileMotionBtn.addEventListener('click', () => {
          state.reducedMotion = !state.reducedMotion;
          document.documentElement.setAttribute('data-motion', state.reducedMotion ? 'reduced' : 'normal');
          renderCurrentRoute(false);
        });
      }

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          state.role = 'invitado';
          showToast('Sesión cerrada correctamente.', false);
          window.location.hash = '#portada';
        });
      }

      // Botón rápido para elevar a Admin en vistas protegidas
      document.querySelectorAll('[data-quick-elevate="admin"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.role = 'admin';
          showToast('Rol Administrador activado.', false);
          renderCurrentRoute(false);
        });
      });

      // Administración: Resultados de carrera con validación (TC-12)
      const adminRaceForm = document.getElementById('adminRaceForm');
      if (adminRaceForm) {
        adminRaceForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const raceSel = document.getElementById('admRaceSelect');
          const pilotSel = document.getElementById('admPilotSelect');
          const statusSel = document.getElementById('admStatusSelect');
          const posIn = document.getElementById('admPosInput');
          const ptsIn = document.getElementById('admPointsInput');
          const noteIn = document.getElementById('admFiaNoteInput');

          const raceErr = document.getElementById('admRaceSelectError');
          const pilotErr = document.getElementById('admPilotSelectError');
          const posErr = document.getElementById('admPosError');
          const ptsErr = document.getElementById('admPointsError');
          const noteErr = document.getElementById('admFiaNoteError');

          [raceErr, pilotErr, posErr, ptsErr, noteErr].forEach(el => el.style.display = 'none');

          if (!raceSel.value) {
            raceErr.textContent = 'Falta seleccionar el Gran Premio al que corresponde el acta.';
            raceErr.style.display = 'flex';
            raceSel.focus();
            return;
          }
          if (!pilotSel.value) {
            pilotErr.textContent = 'Falta indicar el piloto evaluado en esta acta.';
            pilotErr.style.display = 'flex';
            pilotSel.focus();
            return;
          }
          if (statusSel.value === 'POSICION' && (!posIn.value || Number(posIn.value) < 1)) {
            posErr.textContent = 'Para el estado «Posición oficial en meta» debes indicar el puesto numérico (1 a 20).';
            posErr.style.display = 'flex';
            posIn.focus();
            return;
          }
          if (ptsIn.value === '' || Number(ptsIn.value) < 0) {
            ptsErr.textContent = 'Falta indicar los puntos otorgados (0 o superior).';
            ptsErr.style.display = 'flex';
            ptsIn.focus();
            return;
          }
          if (!noteIn.value.trim()) {
            noteErr.textContent = 'Falta escribir la observación o verificación de la FIA.';
            noteErr.style.display = 'flex';
            noteIn.focus();
            return;
          }

          const raceObj = state.carreras.find(c => c.id === raceSel.value);
          const pilotObj = getPilotById(pilotSel.value);

          state.adminRaceDraft = {
            raceId: raceObj.id,
            raceName: raceObj.nombre,
            pilotId: pilotObj.id,
            pilotName: pilotObj.nombre,
            estado: statusSel.value,
            posicion: statusSel.value === 'POSICION' ? Number(posIn.value) : null,
            puntos: Number(ptsIn.value),
            notaFia: noteIn.value.trim()
          };
          renderCurrentRoute(false);
        });
      }

      const confirmRacePublishBtn = document.getElementById('confirmRacePublishBtn');
      if (confirmRacePublishBtn) {
        confirmRacePublishBtn.addEventListener('click', () => {
          if (!state.adminRaceDraft) return;
          saveUndoSnapshot(`Acta de carrera (${state.adminRaceDraft.pilotName})`);
          const d = state.adminRaceDraft;
          const raceObj = state.carreras.find(c => c.id === d.raceId);
          if (raceObj) {
            raceObj.estado = 'Disputada';
            raceObj.notaFia = d.notaFia;
            raceObj.resultados.unshift({
              pilotoId: d.pilotId,
              estado: d.estado,
              posicion: d.posicion,
              tiempo: d.notaFia,
              puntos: d.puntos
            });
          }
          const pilotObj = getPilotById(d.pilotId);
          if (pilotObj) {
            pilotObj.puntos += d.puntos;
            const eq = getTeamById(pilotObj.escuderiaId);
            if (eq) eq.puntos += d.puntos;
          }
          state.selectedRaceId = d.raceId;
          state.adminRaceDraft = null;
          showToast('Acta de carrera publicada oficialmente. Puedes deshacer la acción si hubo un error.', true);
          renderCurrentRoute(false);
        });
      }

      const cancelRaceDraftBtn = document.getElementById('cancelRaceDraftBtn');
      if (cancelRaceDraftBtn) {
        cancelRaceDraftBtn.addEventListener('click', () => {
          state.adminRaceDraft = null;
          renderCurrentRoute(false);
        });
      }

      // Administración: Operaciones de economía (US-17 / TC-13)
      const adminEconForm = document.getElementById('adminEconForm');
      if (adminEconForm) {
        adminEconForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const teamSel = document.getElementById('econTeamSelect');
          const typeSel = document.getElementById('econTypeSelect');
          const amountIn = document.getElementById('econAmountInput');
          const conceptIn = document.getElementById('econConceptInput');

          const amountErr = document.getElementById('econAmountError');
          const conceptErr = document.getElementById('econConceptError');
          amountErr.style.display = 'none';
          conceptErr.style.display = 'none';

          const rawAmount = Number(amountIn.value);
          if (!amountIn.value || isNaN(rawAmount) || rawAmount <= 0) {
            amountErr.textContent = 'Introduce un importe numérico mayor que 0,00 €.';
            amountErr.style.display = 'flex';
            amountIn.focus();
            return;
          }
          if (!conceptIn.value.trim()) {
            conceptErr.textContent = 'Indica el concepto anunciado en WhatsApp para el libro de movimientos.';
            conceptErr.style.display = 'flex';
            conceptIn.focus();
            return;
          }

          const eq = getTeamById(teamSel.value);
          const delta = typeSel.value === 'INGRESO' ? rawAmount : -rawAmount;
          state.adminEconDraft = {
            teamId: eq.id,
            teamName: eq.nombre,
            tipo: typeSel.value,
            importe: rawAmount,
            concepto: conceptIn.value.trim(),
            nuevoSaldo: eq.saldo + delta
          };
          renderCurrentRoute(false);
        });
      }

      const confirmEconBtn = document.getElementById('confirmEconBtn');
      if (confirmEconBtn) {
        confirmEconBtn.addEventListener('click', () => {
          if (!state.adminEconDraft) return;
          saveUndoSnapshot(`Operación económica en ${state.adminEconDraft.teamName}`);
          const d = state.adminEconDraft;
          const eq = getTeamById(d.teamId);
          if (eq) {
            eq.saldo = d.nuevoSaldo;
          }
          state.movimientos.unshift({
            id: 'mov-' + Date.now(),
            fecha: '22/04/2026',
            escuderiaId: d.teamId,
            tipo: d.tipo,
            concepto: d.concepto,
            importe: d.importe
          });
          state.adminEconDraft = null;
          showToast(`Operación aplicada: ${d.tipo === 'INGRESO' ? '+' : '−'}${formatEuros(d.importe)} en ${d.teamName}.`, true);
          renderCurrentRoute(false);
        });
      }

      const cancelEconDraftBtn = document.getElementById('cancelEconDraftBtn');
      if (cancelEconDraftBtn) {
        cancelEconDraftBtn.addEventListener('click', () => {
          state.adminEconDraft = null;
          renderCurrentRoute(false);
        });
      }

      // Administración: Medios (#admin-media)
      const adminMediaForm = document.getElementById('adminMediaForm');
      if (adminMediaForm) {
        adminMediaForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const titleIn = document.getElementById('mediaTitleInput');
          const typeSel = document.getElementById('mediaTypeSelect');
          const errEl = document.getElementById('mediaTitleError');
          if (!titleIn.value.trim()) {
            errEl.textContent = 'Escribe el título descriptivo de la pieza gráfica.';
            errEl.style.display = 'flex';
            titleIn.focus();
            return;
          }
          saveUndoSnapshot('Publicación de medio');
          state.medios.unshift({
            id: 'med-' + Date.now(),
            titulo: titleIn.value.trim(),
            autor: state.currentUser.nombre,
            fecha: '22/04/2026',
            tipo: typeSel.value
          });
          showToast('Pieza añadida al archivo de medios.', true);
          renderCurrentRoute(false);
        });
      }

      document.querySelectorAll('[data-delete-media]').forEach(btn => {
        btn.addEventListener('click', () => {
          saveUndoSnapshot('Eliminación de medio');
          const id = btn.getAttribute('data-delete-media');
          state.medios = state.medios.filter(m => m.id !== id);
          showToast('Medio eliminado del archivo. Puedes deshacer la acción.', true);
          renderCurrentRoute(false);
        });
      });

      // Administración: Usuarios (#admin-usuarios)
      document.querySelectorAll('[data-toggle-user-role]').forEach(btn => {
        btn.addEventListener('click', () => {
          saveUndoSnapshot('Cambio de rol de usuario');
          const id = btn.getAttribute('data-toggle-user-role');
          const usr = state.usuariosLiga.find(u => u.id === id);
          if (usr) {
            usr.rol = usr.rol === 'Administrador' ? 'Jeque' : 'Administrador';
            showToast(`Rol de ${usr.nombre} actualizado a ${usr.rol}.`, true);
            renderCurrentRoute(false);
          }
        });
      });

      // Botones de reintento o restauración de estado de datos (TC-07)
      document.querySelectorAll('[data-action="reset-viewstate"], [data-action="retry-viewstate"]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.viewState = 'normal';
          showToast('Lectura de datos restablecida con éxito.', false);
          renderCurrentRoute(false);
        });
      });
    }

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.theme);
      renderCurrentRoute(false);
    }

    function openReviewModal(route, selector) {
      document.getElementById('reviewTargetRoute').value = route;
      document.getElementById('reviewTargetSelector').value = selector;
      document.getElementById('reviewNoteInput').value = '';
      document.getElementById('reviewNoteError').style.display = 'none';
      document.getElementById('reviewModalBackdrop').classList.add('open');
      document.getElementById('reviewModal').classList.add('open');
      document.getElementById('reviewNoteInput').focus();
    }

    function closeReviewModal() {
      document.getElementById('reviewModalBackdrop').classList.remove('open');
      document.getElementById('reviewModal').classList.remove('open');
    }

    function downloadReviewJson() {
      const payload = {
        aplicacion: 'F1 Bugambra',
        fechaExportacion: new Date().toISOString(),
        totalMarcas: state.reviewMarks.length,
        marcas: state.reviewMarks
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'f1-bugambra-revision.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Archivo JSON de revisión descargado correctamente.', false);
    }

    function initGlobalListeners() {
      // Navegación por hash (TC-01, TC-05, TC-06)
      window.addEventListener('hashchange', () => {
        closeDrawer(false);
        renderCurrentRoute(true);
      });

      // Botón Menú y Cierre (TC-04)
      document.getElementById('menuToggleBtn').addEventListener('click', () => {
        const isOpen = document.getElementById('sideDrawer').classList.contains('open');
        if (isOpen) closeDrawer(true);
        else openDrawer();
      });

      document.getElementById('menuCloseBtn').addEventListener('click', () => closeDrawer(true));
      document.getElementById('drawerBackdrop').addEventListener('click', () => closeDrawer(true));

      // Atajos de teclado: 'M' abre/cierra el menú lateral y 'Esc' cierra menú o modales (TC-04)
      document.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';

        if (!isTyping && (e.key === 'm' || e.key === 'M')) {
          e.preventDefault();
          const isOpen = document.getElementById('sideDrawer').classList.contains('open');
          if (isOpen) closeDrawer(true);
          else openDrawer();
        } else if (e.key === 'Escape') {
          if (document.getElementById('reviewModal').classList.contains('open')) {
            closeReviewModal();
          } else if (document.getElementById('sideDrawer').classList.contains('open')) {
            closeDrawer(true);
          } else if (document.getElementById('searchPanel').classList.contains('open')) {
            document.getElementById('searchPanel').classList.remove('open');
            document.getElementById('searchToggleBtn').focus();
          }
        }
      });

      // Selector de Rol en barra superior (TC-10, TC-11)
      document.querySelectorAll('[data-set-role]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.role = btn.getAttribute('data-set-role');
          showToast(`Rol cambiado a: ${state.role.toUpperCase()}`, false);
          renderCurrentRoute(false);
        });
      });

      // Selector de Estado de Datos (TC-07)
      document.querySelectorAll('[data-set-viewstate]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.viewState = btn.getAttribute('data-set-viewstate');
          renderCurrentRoute(false);
        });
      });

      // Tema Claro / Oscuro (US-04 / TC-15)
      document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

      // Deshacer global (TC-13)
      document.getElementById('globalUndoBtn').addEventListener('click', executeUndo);
      document.getElementById('globalToastCloseBtn').addEventListener('click', () => {
        document.getElementById('globalToast').classList.remove('visible');
      });

      // Buscador global en cabecera (US-21)
      const searchToggleBtn = document.getElementById('searchToggleBtn');
      const searchPanel = document.getElementById('searchPanel');
      const searchInput = document.getElementById('globalSearchInput');
      const searchResults = document.getElementById('globalSearchResults');

      searchToggleBtn.addEventListener('click', () => {
        const open = searchPanel.classList.toggle('open');
        searchToggleBtn.setAttribute('aria-expanded', String(open));
        if (open) searchInput.focus();
      });

      searchInput.addEventListener('input', () => {
        const q = searchInput.value.trim().toLowerCase();
        if (!q) {
          searchResults.innerHTML = '';
          return;
        }
        const matchedRoutes = ROUTES_CONFIG.filter(r => r.title.toLowerCase().includes(q) || r.hash.toLowerCase().includes(q));
        const matchedPilots = state.pilotos.filter(p => p.nombre.toLowerCase().includes(q));
        const matchedTeams = state.equipos.filter(t => t.nombre.toLowerCase().includes(q) || t.jeque.toLowerCase().includes(q));

        let html = '<div style="border-top:1px solid var(--c-ink); padding-top:8px; display:flex; flex-direction:column; gap:6px;">';
        matchedRoutes.forEach(r => {
          html += `<a href="${r.hash}" class="search-result-link">Pantalla: ${escapeHtml(r.title)} (${r.hash})</a>`;
        });
        matchedTeams.forEach(t => {
          html += `<a href="#escuderia" data-search-team="${t.id}" class="search-result-link">Escudería: ${escapeHtml(t.nombre)} — Jeque ${escapeHtml(t.jeque)}</a>`;
        });
        matchedPilots.forEach(p => {
          html += `<a href="#mercado" class="search-result-link">Piloto: ${escapeHtml(p.nombre)} (#${p.dorsal}) · ${p.puntos} pts</a>`;
        });
        if (!matchedRoutes.length && !matchedTeams.length && !matchedPilots.length) {
          html += `<p style="color:var(--c-muted);">Sin coincidencias para «${escapeHtml(q)}».</p>`;
        }
        html += '</div>';
        searchResults.innerHTML = html;

        searchResults.querySelectorAll('.search-result-link').forEach(link => {
          link.addEventListener('click', () => {
            const teamId = link.getAttribute('data-search-team');
            if (teamId) state.selectedTeamId = teamId;
            searchPanel.classList.remove('open');
          });
        });
      });

      // Modo Revisar (RF-12 / US-20 / TC-19)
      document.getElementById('reviewModeToggleBtn').addEventListener('click', () => {
        state.reviewMode = !state.reviewMode;
        syncHeaderAndToolbarUI(getNormalizedHash());
        showToast(
          state.reviewMode
            ? 'Modo Revisar ACTIVO: Toca cualquier bloque punteado de la pantalla para añadir una nota.'
            : 'Modo Revisar desactivado.',
          false
        );
      });

      document.getElementById('appMain').addEventListener('click', (e) => {
        if (!state.reviewMode) return;
        const reviewable = e.target.closest('[data-reviewable]');
        if (!reviewable) return;
        e.preventDefault();
        e.stopPropagation();
        const key = reviewable.getAttribute('data-reviewable');
        const selector = `[data-reviewable="${key}"]`;
        openReviewModal(getNormalizedHash(), selector);
      }, true);

      document.getElementById('closeReviewModalBtn').addEventListener('click', closeReviewModal);
      document.getElementById('cancelReviewModalBtn').addEventListener('click', closeReviewModal);

      document.getElementById('reviewNoteForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const route = document.getElementById('reviewTargetRoute').value;
        const selector = document.getElementById('reviewTargetSelector').value;
        const noteIn = document.getElementById('reviewNoteInput');
        const errEl = document.getElementById('reviewNoteError');

        if (!noteIn.value.trim()) {
          errEl.textContent = 'Escribe una nota antes de guardar la marca de revisión.';
          errEl.style.display = 'flex';
          noteIn.focus();
          return;
        }

        state.reviewMarks.push({
          route,
          selector,
          note: noteIn.value.trim(),
          timestamp: new Date().toISOString()
        });

        closeReviewModal();
        renderCurrentRoute(false);
        showToast(`Marca de revisión guardada en ${route} (${selector}).`, false);
      });

      document.getElementById('downloadReviewJsonBtn').addEventListener('click', downloadReviewJson);
    }

    // Arranque inicial en #portada si no hay hash activo (TC-01 y TC-06)
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.location.hash) {
        window.location.hash = '#portada';
      }
      initGlobalListeners();
      renderCurrentRoute(false);
    });
  </script>

  <!-- Conexión de solo lectura con los datos públicos de la liga (docs/redesign/connected/README.md) -->

  <script>
    (function () {
      if (!window.BugambraLive || !window.fetch) return;
      BugambraLive.CONFIG.apiKey = 'AIzaSyDROC-k5p-43Q3CRTdwLwleyjfHkxsq9nQ'; // clave web pública de Firebase, la misma que usa la app
      var prev = state.viewState; state.viewState = 'loading'; renderCurrentRoute(false);
      BugambraLive.loadLive(window.fetch.bind(window)).then(function (raw) {
        BugambraLive.applyToState(state, BugambraLive.mapLiveData(raw), raw.split.nombre);
        state.viewState = prev; renderCurrentRoute(false);
        showToast('Datos reales de ' + raw.split.nombre + ' (solo lectura).');
      }).catch(function () {
        state.viewState = prev; renderCurrentRoute(false);
        showToast('No se pudieron leer los datos reales: se muestran datos de ejemplo.');
      });
    })();
  </script>
